<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background:#f1f5f9;margin:0;padding:16px 8px;font-family:'Inter',-apple-system,sans-serif;">

<table align="left" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width:760px;margin:0 0 24px 0;background:#ffffff;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);table-layout:fixed;">

  <!-- SECTION 1: ATTENDANCE & TIME (3 + 2 Grid) -->
  <tr>
    <td style="background:#ffffff;padding:18px 20px;">
      <div style="font-size:11px;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #f1f5f9;">1. Attendance &amp; Time</div>
      
      <!-- ROW 1: Status, Check In, Check Out (3 cards) -->
      <table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:separate;border-spacing:6px 0;table-layout:fixed;margin-bottom:8px;">
        <tr>
          <td style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 6px;text-align:center;width:33.33%;">
            <div style="font-size:9px;color:#166534;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">Status</div>
            <div style="font-size:14px;font-weight:800;color:#15803d;margin-top:3px;word-break:keep-all;">Present</div>
          </td>
          <td style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 6px;text-align:center;width:33.33%;">
            <div style="font-size:9px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">Check In</div>
            <div style="font-size:14px;font-weight:700;color:#0f172a;margin-top:3px;word-break:keep-all;">08:47 AM</div>
          </td>
          <td style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 6px;text-align:center;width:33.33%;">
            <div style="font-size:9px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">Check Out</div>
            <div style="font-size:14px;font-weight:700;color:#0f172a;margin-top:3px;word-break:keep-all;">04:10 PM</div>
          </td>
        </tr>
      </table>

      <!-- ROW 2: Work Hours, Travelled (2 cards) -->
      <table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:separate;border-spacing:6px 0;table-layout:fixed;">
        <tr>
          <td style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 8px;text-align:center;width:50%;">
            <div style="font-size:9px;color:#1d4ed8;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">Work Hours</div>
            <div style="font-size:14px;font-weight:800;color:#1d4ed8;margin-top:3px;word-break:keep-all;">9h 38m</div>
          </td>
          <td style="background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:10px 8px;text-align:center;width:50%;">
            <div style="font-size:9px;color:#92400e;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">Travelled</div>
            <div style="font-size:14px;font-weight:800;color:#d97706;margin-top:3px;word-break:keep-all;">17.69 km</div>
          </td>
        </tr>
      </table>

    </td>
  </tr>

  <!-- SECTION 2: ACTIVITY SUMMARY (4 cards) -->
  <tr>
    <td style="background:#ffffff;padding:0 20px 20px;">
      <div style="font-size:11px;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #f1f5f9;">2. Activity Summary</div>
      <table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:separate;border-spacing:6px 0;table-layout:fixed;">
        <tr>
          <td style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 4px;text-align:center;width:25%;">
            <div style="font-size:9px;color:#166534;font-weight:700;text-transform:uppercase;">Prospect Calls</div>
            <div style="font-size:18px;font-weight:800;color:#15803d;margin-top:4px;">0</div>
          </td>
          <td style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 4px;text-align:center;width:25%;">
            <div style="font-size:9px;color:#1d4ed8;font-weight:700;text-transform:uppercase;">Follow-ups</div>
            <div style="font-size:18px;font-weight:800;color:#2563eb;margin-top:4px;">3</div>
          </td>
          <td style="background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:12px 4px;text-align:center;width:25%;">
            <div style="font-size:9px;color:#92400e;font-weight:700;text-transform:uppercase;">New Leads</div>
            <div style="font-size:18px;font-weight:800;color:#d97706;margin-top:4px;">0</div>
          </td>
          <td style="background:#faf5ff;border:1px solid #e9d5ff;border-radius:8px;padding:12px 4px;text-align:center;width:25%;">
            <div style="font-size:9px;color:#6b21a8;font-weight:700;text-transform:uppercase;">Sites Visited</div>
            <div style="font-size:18px;font-weight:800;color:#7e22ce;margin-top:4px;">2</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>

</table>

</body>
</html>
